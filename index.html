const ORIGINAL_DECO_GROUPS={eyes:'face',smile:'face',blush:'face',flower:'nature',berry:'nature',star:'accent',heart:'accent',bow:'accent'};
for(const a of builtins)if(a.category==='deco')a.decoGroup=ORIGINAL_DECO_GROUPS[a.id.replace('deco-','')]||'accent';
for(const [id,group,name,svg] of EXTRA_DECOS)builtins.push({id:'deco-'+id,category:'deco',name,decoGroup:group,src:svgURI(vectorArt(svg)),builtin:true});
const DECO_FILTERS=[['all','전체'],['face','😊 표정'],['animal','🐰 동물'],['nature','🌿 자연'],['vehicle','🚗 탈것'],['accent','✨ 장식'],['mine','📷 선생님 자료']];
function visibleMaterials(){const items=allAssets(studioTab);if(studioTab!=='deco'||decoFilter==='all')return items;return items.filter(a=>decoFilter==='mine'?!a.builtin:a.decoGroup===decoFilter)}

const baseBackgrounds=[{id:'paper',name:'따뜻한 종이'},{id:'forest',name:'가을 숲'},{id:'sky',name:'하늘'},{id:'pond',name:'연못'},{id:'meadow',name:'가을 들판'}];
const MOTIONS=[{id:'float',name:'훨훨 날아요',icon:'🦋'},{id:'swim',name:'헤엄쳐요',icon:'🐟'},{id:'walk',name:'걸어가요',icon:'🐾'},{id:'bounce',name:'폴짝 뛰어요',icon:'🐰'},{id:'sway',name:'살랑살랑',icon:'🍃'},{id:'drive',name:'슝 달려요',icon:'🚗'}];
function freshScene(){return {bgId:'paper',elements:[],strokes:[]}}
function freshStage(id){return {id,bgId:'forest',entries:[],updatedAt:now()}}
function getKid(id){return kids.find(k=>k.id===id)}
function ownerLabel(id){return id==='guest'?'체험 친구':(getKid(id)?.name||works.find(w=>w.ownerId===id)?.ownerName||'이전 친구')}
function getAsset(id){return builtins.find(x=>x.id===id)||assets.find(x=>x.id===id)}
function backgrounds(){return [...baseBackgrounds,...assets.filter(a=>a.category==='bg').map(a=>({id:a.id,name:a.name}))]}
function allAssets(type){return [...builtins.filter(x=>x.category===type),...assets.filter(x=>x.category===type)]}
function dbOpen(){return new Promise((ok,no)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{for(const s of STORES)if(!req.result.objectStoreNames.contains(s))req.result.createObjectStore(s,{keyPath:'id'})};req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
function dbGetAll(store){return new Promise((ok,no)=>{const t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbPut(store,record){return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.objectStore(store).put(record)})}
function dbDel(store,id){return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.objectStore(store).delete(id)})}
function dbReplaceAll(data){return new Promise((ok,no)=>{const t=db.transaction(STORES,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);for(const s of STORES){let store=t.objectStore(s);store.clear();for(const record of data[s])store.put(record)}})}
async function reloadData(){[kids,assets,works,drafts,exhibits]=await Promise.all(['kids','assets','works','drafts','exhibits'].map(dbGetAll));const a=await dbGetAll('settings');settings={...defaultSettings,...(a.find(r=>r.id==='main')||{})};imgCache.clear()}
function getDraft(){return drafts.find(d=>d.id==='draft-'+ownerId)}
const clone=x=>JSON.parse(JSON.stringify(x));
function saveStatus(message,error=false){for(const el of document.querySelectorAll('[data-save-status]')){el.textContent=message;el.classList.toggle('error',error)}}
function toast(message,bad=false){const el=$('toast');el.textContent=message;el.classList.toggle('bad',bad);el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3000)}
function markDraft(){clearTimeout(saveTimer);saveStatus('● 자동 저장 대기 중');saveTimer=setTimeout(()=>persistDraft(),750);scheduleOnlineLive(true)}
async function persistDraft(){clearTimeout(saveTimer);if(saveBusy){saveTimer=setTimeout(persistDraft,500);return}saveBusy=true;const record={id:'draft-'+ownerId,ownerId,workId:currentWorkId,scene:clone(scene),updatedAt:now()};try{await dbPut('drafts',record);let ix=drafts.findIndex(d=>d.id===record.id);if(ix>=0)drafts[ix]=record;else drafts.push(record);saveStatus('✓ 자동 저장됨')}catch(e){saveStatus('⚠ 자동 저장 실패 — 저장 공간을 확인해 주세요',true);toast('자동 저장에 실패했어요. 백업을 확인해 주세요.',true)}finally{saveBusy=false}}
async function flushDraft(){if(saveTimer){clearTimeout(saveTimer);await persistDraft()}}
function checkpoint(previous=null){history.push(previous||JSON.stringify(scene));if(history.length>65)history.shift();future=[];markDraft();renderStudioCanvas();refreshStudioControls()}
function mutate(fn){const prev=JSON.stringify(scene);fn();checkpoint(prev)}
function undo(){if(!history.length)return;future.push(JSON.stringify(scene));scene=JSON.parse(history.pop());selectedElement=null;markDraft();render();}
function redo(){if(!future.length)return;history.push(JSON.stringify(scene));scene=JSON.parse(future.pop());selectedElement=null;markDraft();render();}
function setView(next){if(stageFrame)cancelAnimationFrame(stageFrame);stageFrame=0;if(onlineFrame)cancelAnimationFrame(onlineFrame);onlineFrame=0;view=next;window.scrollTo({top:0,behavior:'instant'});render()}
function head(extra=''){return `<div class="topbar"><div><div class="brand">🍁 ${esc(settings.title)} <span class="badge">v1.2</span></div><div class="sub">${esc(settings.guide)}</div></div><nav class="nav"><span class="cloud-state ${onlineStatusStyle()}" title="온라인 상태">${esc(onlineStatusText())}</span>${extra||'<button class="btn small" data-act="home">🏠 처음으로</button>'}</nav></div>`}
function footer(){return '<div class="foot">개인 작품 원본은 이 기기에 저장됩니다. 온라인 미술관은 별도로 공유하며, 기기 변경 시 전체 백업·복원을 이용하세요. · v1.2</div>'}

function render(){let html=({home,observe,studio,detail,gallery,stage:stageUI,admin,'online-room':onlineRoomUI,'online-display':onlineDisplayUI})[view]();$('app').innerHTML=`<div class="shell">${html}</div>`;if(view==='studio'){setupStudioPointer();renderStudioCanvas();saveStatus('✓ 자동 저장 사용 중')}if(view==='detail'){ensureAll(scene).then(()=>{let c=$('detail-canvas');if(c)paintScene(c.getContext('2d'),scene,true,false)})}if(view==='stage'){setupStagePointer();repaintStage()}if(view==='admin'&&adminTab==='assets')setupUploadPreview();if(view==='online-display')prepareOnlineDisplay()}
function ensureImage(src){if(!src)return Promise.reject(Error('no image'));let entry=imgCache.get(src);if(entry)return entry.promise;const image=new Image(),promise=new Promise((ok,no)=>{image.onload=()=>ok(image);image.onerror=()=>no(Error('이미지 불러오기 실패'));image.src=src});imgCache.set(src,{image,promise,ready:false});promise.then(()=>{imgCache.get(src).ready=true;if(view==='studio')renderStudioCanvas();if(view==='stage')repaintStage()},()=>imgCache.delete(src));return promise}
function loaded(src){let item=imgCache.get(src);if(!item){ensureImage(src).catch(()=>{});return null}return item.ready?item.image:null}
async function ensureAll(s){await Promise.all([...new Set([...(s.elements||[]).map(e=>getAsset(e.assetId)?.src),assets.find(a=>a.id===s.bgId)?.src].filter(Boolean))].map(ensureImage))}
function fillBackground(ctx,id){ctx.save();const bg=assets.find(a=>a.id===id&&a.category==='bg');if(bg){const im=loaded(bg.src);ctx.fillStyle='#f4f0e8';ctx.fillRect(0,0,W,H);if(im){let scale=Math.max(W/im.width,H/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h)}ctx.restore();return}
const bands={paper:['#fffaf0','#f8e9d5'],forest:['#d9e1c0','#fae5b6'],sky:['#bed9ed','#fbe0c4'],pond:['#b8dcd8','#deeacf'],meadow:['#f3e2bb','#bdd9ac']};const colors=bands[id]||bands.paper;let gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,colors[0]);gradient.addColorStop(1,colors[1]);ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
if(id==='paper'){ctx.strokeStyle='#dabb8c55';ctx.lineWidth=3;ctx.strokeRect(22,22,W-44,H-44)}
if(id==='forest'||id==='meadow'){ctx.fillStyle='#c4b97277';ctx.beginPath();ctx.ellipse(320,680,530,170,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a7bc8188';ctx.beginPath();ctx.ellipse(790,660,410,170,0,0,Math.PI*2);ctx.fill()}
if(id==='forest'){for(let i=0;i<7;i++){let x=i*160-45,scale=.65+(i%3)*.24;ctx.fillStyle='#92735088';ctx.fillRect(x+40,185,21*scale,340*scale);ctx.fillStyle=['#d6a16c8a','#d5bc6a8a','#be8c6c8a'][i%3];ctx.beginPath();ctx.ellipse(x+50,210,95*scale,137*scale,0,0,Math.PI*2);ctx.fill()}}
if(id==='sky'){ctx.fillStyle='#fff9ecbb';for(let i=0;i<4;i++){let x=80+i*260,y=120+(i%2)*110;ctx.beginPath();ctx.ellipse(x,y,72,27,0,0,7);ctx.ellipse(x+45,y-18,50,34,0,0,7);ctx.ellipse(x+100,y,70,26,0,0,7);ctx.fill()}}
if(id==='pond'){ctx.fillStyle='#76b0aab0';ctx.beginPath();ctx.ellipse(480,540,480,185,0,0,7);ctx.fill();ctx.strokeStyle='#deefdd88';for(let i=0;i<6;i++){ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(140+i*147,515+(i%3)*70,50,11,0,0,7);ctx.stroke()}}
ctx.restore()}
function drawStroke(ctx,s){const pts=s.points||[];if(!pts.length)return;ctx.save();ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.lineWidth=s.size||7;ctx.strokeStyle=s.erase?'rgba(0,0,0,1)':s.color||'#554431';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(pts.length===1)ctx.lineTo(pts[0].x+.05,pts[0].y+.05);else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.restore()}
function paintScene(ctx,s,backgroundOn=true,selectionOn=false){ctx.clearRect(0,0,W,H);if(backgroundOn)fillBackground(ctx,s.bgId);for(const e of s.elements||[]){const a=getAsset(e.assetId),im=a?loaded(a.src):null;if(!im)continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot||0);ctx.scale(e.flip?-1:1,1);ctx.drawImage(im,-e.w/2,-e.h/2,e.w,e.h);ctx.restore()}
const dc=document.createElement('canvas');dc.width=W;dc.height=H;const dctx=dc.getContext('2d');for(const s1 of s.strokes||[])drawStroke(dctx,s1);ctx.drawImage(dc,0,0);
if(selectionOn&&selectedElement){let e=s.elements.find(q=>q.id===selectedElement);if(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot||0);ctx.setLineDash([12,8]);ctx.lineWidth=3;ctx.strokeStyle='#6e8a86';ctx.strokeRect(-e.w/2-7,-e.h/2-7,e.w+14,e.h+14);ctx.restore()}}}
function renderStudioCanvas(){const c=$('studio-canvas');if(c)paintScene(c.getContext('2d'),scene,true,true)}
function refreshStudioControls(){if(view!=='studio')return;for(const b of document.querySelectorAll('[data-act="undo"]'))b.disabled=!history.length;for(const b of document.querySelectorAll('[data-act="redo"]'))b.disabled=!future.length;for(const name of ['size-down','size-up','rotate-left','rotate-right','flip','duplicate','front','back','left','right','up','down','delete-selected']){const b=document.querySelector(`[data-act="${name}"]`);if(b)b.disabled=!selectedElement}}
function pointOnCanvas(ev,c){const r=c.getBoundingClientRect();return {x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
function pickElement(els,px,py){for(let i=els.length-1;i>=0;i--){const e=els[i],dx=px-e.x,dy=py-e.y,a=-(e.rot||0);const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=e.w/2&&Math.abs(ly)<=e.h/2)return e}return null}
function setupStudioPointer(){const c=$('studio-canvas');if(!c)return;c.addEventListener('pointerdown',ev=>{if(ev.button!==0&&ev.pointerType==='mouse')return;ev.preventDefault();c.setPointerCapture(ev.pointerId);const p=pointOnCanvas(ev,c);if(studioMode==='move'){const hit=pickElement(scene.elements,p.x,p.y);selectedElement=hit?.id||null;activePointer={id:ev.pointerId,mode:'move',start:p,initial:hit?{x:hit.x,y:hit.y}:null,old:JSON.stringify(scene),moved:false};renderStudioCanvas();refreshStudioControls()}else{selectedElement=null;const stroke={id:uid(),erase:studioMode==='erase',color:brushColor,size:studioMode==='erase'?brushSize*2.4:brushSize,points:[p]};activePointer={id:ev.pointerId,mode:'stroke',old:JSON.stringify(scene),stroke};scene.strokes.push(stroke);renderStudioCanvas()}});c.addEventListener('pointermove',ev=>{const a=activePointer;if(!a||a.id!==ev.pointerId)return;ev.preventDefault();const p=pointOnCanvas(ev,c);if(a.mode==='move'&&a.initial&&selectedElement){const e=scene.elements.find(e=>e.id===selectedElement);if(e){let dx=p.x-a.start.x,dy=p.y-a.start.y;e.x=Math.min(W+60,Math.max(-60,a.initial.x+dx));e.y=Math.min(H+60,Math.max(-60,a.initial.y+dy));if(Math.abs(dx)+Math.abs(dy)>3)a.moved=true}}else if(a.mode==='stroke'){let pts=a.stroke.points,last=pts.at(-1);if(Math.hypot(last.x-p.x,last.y-p.y)>1.6)pts.push(p)}renderStudioCanvas();scheduleOnlineLive(false)});const end=ev=>{let a=activePointer;if(!a||a.id!==ev.pointerId)return;activePointer=null;try{c.releasePointerCapture(ev.pointerId)}catch(e){}if((a.mode==='move'&&a.moved)||(a.mode==='stroke'))checkpoint(a.old)};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}
function addMaterial(id){const a=getAsset(id);if(!a)return;ensureImage(a.src).then(im=>{let aspect=(im.width||180)/(im.height||180),w=a.category==='deco'?145:205,h=w/aspect;if(h>280){h=280;w=h*aspect}mutate(()=>{let q={id:uid(),assetId:id,x:W/2+(Math.random()-.5)*100,y:H/2+(Math.random()-.5)*95,w,h,rot:0,flip:false};scene.elements.push(q);selectedElement=q.id});render()}).catch(()=>toast('재료를 불러오지 못했어요.',true))}
function transformSelected(action){if(!selectedElement)return;const e=scene.elements.find(e=>e.id===selectedElement);if(!e)return;mutate(()=>{switch(action){case 'size-up':e.w=Math.min(820,e.w*1.12);e.h=Math.min(820,e.h*1.12);break;case 'size-down':e.w=Math.max(25,e.w*.89);e.h=Math.max(25,e.h*.89);break;case 'rotate-left':e.rot-=Math.PI/12;break;case 'rotate-right':e.rot+=Math.PI/12;break;case 'flip':e.flip=!e.flip;break;case 'left':e.x-=22;break;case 'right':e.x+=22;break;case 'up':e.y-=22;break;case 'down':e.y+=22;break;case 'duplicate':{let copy={...e,id:uid(),x:e.x+35,y:e.y+35};scene.elements.push(copy);selectedElement=copy.id;break}case 'delete-selected':scene.elements.splice(scene.elements.indexOf(e),1);selectedElement=null;break;case 'front':scene.elements.splice(scene.elements.indexOf(e),1);scene.elements.push(e);break;case 'back':scene.elements.splice(scene.elements.indexOf(e),1);scene.elements.unshift(e);break}});refreshStudioControls()}
function modal(title,html,buttons){$('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between"><h2>${esc(title)}</h2><button class="btn small square" id="modal-x" aria-label="닫기">✕</button></div><div>${html}</div><div class="actions" id="modal-actions"></div></div></div>`;$('modal-x').onclick=closeModal;const area=$('modal-actions');for(const b of buttons||[{name:'닫기',action:closeModal}]){let btn=document.createElement('button');btn.className='btn '+(b.style||'');btn.textContent=b.name;btn.onclick=b.action;area.appendChild(btn)}}

async function makeSprite(s){const c=await renderToCanvas(s,false),ctx=c.getContext('2d');const data=ctx.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(data[(y*W+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}if(x1<0)return null;x0=Math.max(0,x0-8);y0=Math.max(0,y0-8);x1=Math.min(W-1,x1+8);y1=Math.min(H-1,y1+8);const sub=document.createElement('canvas');sub.width=x1-x0+1;sub.height=y1-y0+1;sub.getContext('2d').drawImage(c,x0,y0,sub.width,sub.height,0,0,sub.width,sub.height);return downscaledDataURL(sub,540,'image/png')}
async function saveWork(){if(savingWork)return;savingWork=true;const saveBtn=document.querySelector('[data-act="save-work"]');if(saveBtn)saveBtn.disabled=true;try{const input=$('work-title');if(!input)return;const title=input.value.trim();if(!title){toast('작품 이름을 적어 주세요.',true);input.focus();return}const intro=$('work-intro').value.trim();await ensureAll(scene);let preview=downscaledDataURL(await renderToCanvas(scene,true),560,'image/jpeg');let sprite=await makeSprite(scene);if(!sprite){toast('낙엽이나 그림을 하나 이상 넣어 주세요.',true);return}const record={id:currentWorkId||uid(),ownerId,ownerName:ownerLabel(ownerId),title:title.slice(0,40),intro:intro.slice(0,180),scene:clone(scene),thumb:preview,sprite,updatedAt:now()};const old=works.find(w=>w.id===record.id);if(old)record.createdAt=old.createdAt||now();else record.createdAt=now();try{await dbPut('works',record);const i=works.findIndex(w=>w.id===record.id);if(i>=0)works[i]=record;else works.push(record);currentWorkId=record.id;await persistDraft();queueOnlineCompleted(record);toast('✓ 기기에 작품을 저장했어요!');setView('gallery')}catch(e){toast('작품 저장 실패 — 저장 공간을 확인해 주세요.',true);saveStatus('작품 저장 실패',true)}}finally{savingWork=false;if(saveBtn?.isConnected)saveBtn.disabled=false}}

async function processImage(file){if(!file||!['image/jpeg','image/png'].includes(file.type))throw Error('JPG 또는 PNG 파일을 선택해 주세요.');if(file.size>18*1024*1024)throw Error('18MB 이하의 사진을 선택해 주세요.');const src=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('사진을 읽지 못했어요.'));r.readAsDataURL(file)});const im=await ensureImage(src),scale=Math.min(1,1400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88)}
function setupUploadPreview(){const f=$('upload-file');if(!f)return;f.onchange=async()=>{const file=f.files?.[0];if(!file)return;try{const src=await processImage(file);$('upload-preview').innerHTML=`<div class="row"><img alt="미리보기" src="${src}" style="max-width:150px;max-height:130px;object-fit:contain"><span class="muted">파일 미리보기 · 비율 유지</span></div>`;$('upload-preview').dataset.image=src;if(!$('upload-name').value)$('upload-name').value=file.name.replace(/\.[^.]+$/,'')}catch(e){$('upload-preview').textContent=e.message;delete $('upload-preview').dataset.image}}}

function animatedLocation(e,time){const t=time*(e.speed||1),phase=e.phase||0;let x=e.x,y=e.y,rot=0,scale=1;switch(e.motion){case 'float':x+=Math.sin(t*.75+phase)*45;y+=Math.sin(t*1.2+phase)*24;rot=Math.sin(t*1.1+phase)*.11;break;case 'swim':x+=Math.sin(t*.7+phase)*80;y+=Math.sin(t*1.15+phase)*16;rot=Math.sin(t*.9+phase)*.07;break;case 'walk':x+=Math.sin(t*.62+phase)*70;y-=Math.abs(Math.sin(t*3+phase))*8;rot=Math.sin(t*2.3+phase)*.04;break;case 'bounce':y-=Math.abs(Math.sin(t*2+phase))*65;rot=Math.sin(t+phase)*.04;break;case 'sway':rot=Math.sin(t*1.5+phase)*.16;y+=Math.sin(t*.6+phase)*5;break;case 'drive':x+=Math.sin(t*.55+phase)*145;y+=Math.sin(t*1.1+phase)*5;rot=Math.sin(t*.8+phase)*.03;break;}const hit=stageHits.get(e.id);if(hit){const age=time-hit.start;if(age<1.05){let punch=Math.sin(age*Math.PI/1.05)*hit.amount;scale+=punch*.25;y-=punch*38;rot+=punch*.15}else stageHits.delete(e.id)}return {x,y,rot,scale}}
function drawStage(t=0,selection=true){const c=$('stage-canvas');if(!c||!stage)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);fillBackground(ctx,stage.bgId);for(const e of stage.entries){const work=works.find(w=>w.id===e.workId);if(!work?.sprite)continue;let im=stageSprites.get(e.workId)||loaded(work.sprite);if(!im){ensureImage(work.sprite).catch(()=>{});continue}const p=stagePlaying?animatedLocation(e,t):{x:e.x,y:e.y,rot:0,scale:1};let ww=e.size*(im.width/Math.max(im.width,im.height))*p.scale,hh=e.size*(im.height/Math.max(im.width,im.height))*p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(im,-ww/2,-hh/2,ww,hh);ctx.restore();if(selection&&!stagePlaying&&stageSelected===e.id){ctx.save();ctx.setLineDash([10,6]);ctx.strokeStyle='#397b69';ctx.lineWidth=3;ctx.strokeRect(e.x-ww/2-6,e.y-hh/2-6,ww+12,hh+12);ctx.restore()}}}
function stageLoop(timestamp){if(!stagePlaying||view!=='stage')return;if(stageLast)stageT=Math.min(1e6,stageT+Math.min(.06,(timestamp-stageLast)/1000));stageLast=timestamp;drawStage(stageT);stageFrame=requestAnimationFrame(stageLoop)}
function repaintStage(){if(view!=='stage')return;ensureStageSprites();if(stagePlaying){cancelAnimationFrame(stageFrame);stageLast=0;stageFrame=requestAnimationFrame(stageLoop)}else{cancelAnimationFrame(stageFrame);stageFrame=0;drawStage(0)}}
function stageHitTest(p){for(let i=stage.entries.length-1;i>=0;i--){let e=stage.entries[i],work=works.find(w=>w.id===e.workId),im=work&&stageSprites.get(e.workId),ratio=im?(im.width/Math.max(im.width,im.height)):1,ratioH=im?(im.height/Math.max(im.width,im.height)):1;const q=stagePlaying?animatedLocation(e,stageT):{x:e.x,y:e.y};if(Math.abs(q.x-p.x)<e.size*ratio/2+12&&Math.abs(q.y-p.y)<e.size*ratioH/2+12)return e}return null}
function setupStagePointer(){const c=$('stage-canvas');if(!c)return;let moving=null;c.addEventListener('pointerdown',ev=>{if(ev.button!==0&&ev.pointerType==='mouse')return;ev.preventDefault();const p=pointOnCanvas(ev,c),e=stageHitTest(p);if(stagePlaying){if(e)stageHits.set(e.id,{start:stageT,amount:1});return}if(e){stageSelected=e.id;c.setPointerCapture(ev.pointerId);moving={id:ev.pointerId,entry:e,dx:p.x-e.x,dy:p.y-e.y,moved:false};drawStage(0)}else{stageSelected=null;render()}});c.addEventListener('pointermove',ev=>{if(!moving||moving.id!==ev.pointerId)return;ev.preventDefault();const p=pointOnCanvas(ev,c);moving.entry.x=Math.max(0,Math.min(W,p.x-moving.dx));moving.entry.y=Math.max(0,Math.min(H,p.y-moving.dy));moving.moved=true;drawStage(0)});const end=ev=>{if(!moving||moving.id!==ev.pointerId)return;if(moving.moved)markStage();moving=null;try{c.releasePointerCapture(ev.pointerId)}catch(e){}render()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}

function validateBackup(d){if(!d||d.kind!=='leaf-museum-backup'||d.version!==1)throw Error('이 앱에서 만든 1차 백업 파일이 아니에요.');for(const s of STORES)if(!Array.isArray(d[s]))throw Error(s+' 데이터가 없어요.');const limits={kids:2000,assets:350,works:5000,drafts:2000,exhibits:2000,settings:10};for(const s of STORES){if(d[s].length>limits[s])throw Error('백업 항목이 지나치게 많아요.');const seen=new Set();for(const record of d[s]){if(!record||typeof record.id!=='string'||record.id.length>180||seen.has(record.id))throw Error(s+' 고유번호가 올바르지 않아요.');seen.add(record.id)}}for(const a of d.assets){if(!['leaf','deco','bg'].includes(a.category)||typeof a.name!=='string'||!validData(a.src))throw Error('등록 이미지 자료가 올바르지 않아요.')}for(const w of d.works){if(!validScene(w.scene)||typeof w.ownerId!=='string'||typeof w.title!=='string'||!validData(w.thumb)||!validData(w.sprite))throw Error('작품 데이터가 올바르지 않아요.')}for(const x of d.drafts)if(!validScene(x.scene)||typeof x.ownerId!=='string')throw Error('작업 중인 작품 데이터가 올바르지 않아요.');for(const s of d.exhibits)if(!Array.isArray(s.entries)||s.entries.length>500||typeof s.bgId!=='string'||s.entries.some(e=>typeof e.id!=='string'||typeof e.workId!=='string'||!Number.isFinite(e.x)||!Number.isFinite(e.y)||!Number.isFinite(e.size)||!MOTIONS.some(m=>m.id===e.motion)))throw Error('움직이는 전시 데이터가 올바르지 않아요.');for(const k of d.kids)if(typeof k.name!=='string')throw Error('명단이 올바르지 않아요.');for(const st of d.settings)if(st.id!=='main'||typeof st.title!=='string'||typeof st.guide!=='string')throw Error('설정 데이터가 올바르지 않아요.');return true}
function validData(s){return typeof s==='string'&&/^data:image\/(png|jpeg);base64,[a-zA-Z0-9+/=]+$/.test(s)&&s.length<30e6}
function validScene(s){return !!s&&typeof s.bgId==='string'&&Array.isArray(s.elements)&&Array.isArray(s.strokes)&&s.elements.length<=600&&s.strokes.length<=1200&&s.elements.every(e=>typeof e.id==='string'&&typeof e.assetId==='string'&&[e.x,e.y,e.w,e.h,e.rot].every(Number.isFinite))&&s.strokes.every(z=>Array.isArray(z.points)&&z.points.length<50000&&z.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)))}

 b.onAuthStateChanged(online.auth,async user=>{online.uid=user?.uid||null;if(!user){online.role='none';onlineSafeRender();return}const saved=localStorage.getItem(ONLINE_ROOM_KEY);if(saved&&/^[A-HJ-NP-Z2-9]{6}$/.test(saved)){online.room=saved;await onlineWatchMembership()}else onlineSafeRender()});onlineSafeRender();return online.api

function randomRoomCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const buf=new Uint32Array(6);crypto.getRandomValues(buf);return [...buf].map(n=>alphabet[n%alphabet.length]).join('')}
async function onlineTeacherLogin(){if(!await initOnline()){toast('먼저 Firebase 설정을 등록해 주세요.',true);return}const email=$('online-teacher-email')?.value.trim(),password=$('online-teacher-password')?.value;if(!email||!password){toast('이메일과 비밀번호를 입력해 주세요.',true);return}try{const res=await online.api.signInWithEmailAndPassword(online.auth,email,password);online.uid=res.user.uid;online.error='';toast('교사 계정으로 연결했어요.');onlineSafeRender()}catch(e){online.error=String(e);toast(firebaseMessage(e),true);onlineSafeRender()}}
async function onlineCreateRoom(){if(!online.api||!online.uid||online.auth.currentUser?.isAnonymous){toast('교사 이메일로 먼저 로그인해 주세요.',true);return}const a=online.api;try{const room=randomRoomCode(),payload={teacherUid:online.uid,createdAt:a.serverTimestamp(),members:{[online.uid]:{role:'teacher',name:'선생님'}},settings:{liveEnabled:true,completedEnabled:true}};await a.set(a.ref(online.db,`rooms/${room}`),payload);online.room=room;online.role='teacher';localStorage.setItem(ONLINE_ROOM_KEY,room);await onlineStartRoomListeners();toast('우리 반 방을 만들었어요!');render()}catch(e){online.error=String(e);toast(firebaseMessage(e),true)}}

function onlineCompletedList(){return Object.values(online.completed).filter(w=>w&&typeof w.id==='string'&&w.sprite&&(/^data:image\/(png|jpeg);base64,/).test(w.sprite)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
function onlineLiveList(){return Object.entries(online.live).filter(([id,w])=>w&&typeof w.image==='string'&&/^data:image\/jpeg;base64,/.test(w.image)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
function onlineDisplayUI(){const connected=onlineReady();const list=onlineCompletedList(),shown=list.filter(w=>!w.hidden),maxPages=Math.max(1,Math.ceil(shown.length/12));onlinePage=Math.min(onlinePage,maxPages-1);const roomInfo=`${esc(online.room||'연결되지 않음')} · ${online.role==='viewer'?'감상 전용':online.role==='teacher'?'교사 감상':'작품 공유'}`;return `${head('<button class="btn small" data-act="online-room">← 학급 방</button><button class="btn small" data-act="home">🏠 처음으로</button>')}<div class="online-wide stack"><div class="row between"><h2 class="section-title">🌳 우리 반 살아있는 미술관</h2><span class="pill">${roomInfo}</span></div><div class="toggle"><button class="btn ${onlineDisplayMode==='live'?'active':''}" data-act="online-mode-live">🎨 만드는 중</button><button class="btn ${onlineDisplayMode==='completed'?'active':''}" data-act="online-mode-completed">🦋 완성 작품 전시</button></div>${!connected?'<div class="notice">실시간 미술관을 보려면 학급 방에 먼저 입장해야 해요.</div>':onlineDisplayMode==='live'?`<div class="notice">친구가 작품을 움직이거나 그리는 모습이 조금씩 갱신돼요. 한 작품을 누르면 크게 볼 수 있어요.</div><div class="online-livegrid">${onlineLiveList().map(([id,r])=>`<button class="online-livecard" data-act="online-live-zoom" data-id="${esc(id)}"><img src="${esc(r.image)}" alt="${esc(r.name||'친구')}의 작품"><strong>🍂 ${esc(r.name||'친구의 작품')}</strong><span class="micro">${Date.now()-(r.updatedAt||0)<120000?'● 최근 작업':'마지막 작업 모습'}</span></button>`).join('')||'<div class="empty">친구가 작품을 꾸미면 이곳에 나타나요.</div>'}</div>`:`<section class="panel"><div class="row between"><div class="row"><button class="btn ${onlinePlaying?'green':'soft'}" data-act="online-replay">${onlinePlaying?'⏸ 움직임 멈추기':'▶️ 움직이기'}</button><span class="muted">작품을 톡 건드려 보세요!</span></div><div class="row"><button class="btn small" data-act="online-page-prev" ${onlinePage===0?'disabled':''}>← 이전</button><span class="micro">${onlinePage+1}/${maxPages}</span><button class="btn small" data-act="online-page-next" ${onlinePage>=maxPages-1?'disabled':''}>다음 →</button></div></div><div class="board-wrap" style="margin-top:10px"><canvas id="online-stage-canvas" class="board" width="960" height="720" aria-label="우리 반 완성 작품이 움직이는 전시"></canvas></div><div class="muted">완성 작품 ${shown.length}개 · 한 화면에 최대 12개. 원본 작품은 변경하지 않아요.</div></section>${online.role==='teacher'?`<section class="panel stack"><h3 class="panel-title">교사: 작품 움직임·전시 관리</h3><div class="online-complete-list">${list.map(w=>`<div class="online-complete-item"><img src="${esc(w.thumb||w.sprite)}" alt=""><label><b>${esc(w.title||'제목 없음')}</b><span class="micro">${esc(w.ownerName||'친구')}</span><select data-online-motion="${esc(w.id)}">${MOTIONS.map(m=>`<option value="${m.id}" ${m.id===(w.motion||'float')?'selected':''}>${m.icon} ${m.name}</option>`).join('')}</select></label><button class="btn small ${w.hidden?'soft':'danger'}" data-act="online-hide" data-id="${esc(w.id)}" data-hidden="${w.hidden?'true':'false'}">${w.hidden?'보이기':'숨기기'}</button></div>`).join('')||'<p class="muted">저장된 온라인 작품이 없어요.</p>'}</div></section>`:''}`}</div>${footer()}`}
function onlineZoom(id){const r=online.live[id];if(!r||!/^data:image\/jpeg;base64,/.test(r.image))return;modal('🎨 '+esc(r.name||'친구의 작품'),`<img style="width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:13px;background:#f9efde" src="${esc(r.image)}" alt="작업 중인 낙엽 작품"><p class="muted">새로운 모습을 보려면 창을 닫고 다시 선택해요.</p>`,[{name:'닫기',action:closeModal}])}
function prepareOnlineDisplay(){if(onlineDisplayMode!=='completed')return;const c=$('online-stage-canvas');if(!c)return;c.addEventListener('pointerdown',e=>{e.preventDefault();const p=pointOnCanvas(e,c),entries=onlineStageEntries();for(let i=entries.length-1;i>=0;i--){const x=animatedLocation(entries[i],onlineT);if(Math.abs(x.x-p.x)<115&&Math.abs(x.y-p.y)<115){onlineHits.set(entries[i].id,{start:onlineT,amount:1});break}}});onlineLast=0;onlineT=0;if(onlinePlaying)onlineFrame=requestAnimationFrame(onlineLoop);else drawOnlineStage(0)}
function onlineStageEntries(){const list=onlineCompletedList().filter(w=>!w.hidden).slice(onlinePage*12,(onlinePage+1)*12);return list.map((w,i)=>({id:w.id,sprite:w.sprite,x:125+(i%4)*235,y:125+Math.floor(i/4)*230,size:180,motion:MOTIONS.some(m=>m.id===w.motion)?w.motion:'float',speed:.65,phase:i*1.618}))}
function drawOnlineStage(t){const c=$('online-stage-canvas');if(!c||view!=='online-display'||onlineDisplayMode!=='completed')return;const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);fillBackground(ctx,'forest');const entries=onlineStageEntries();for(const e of entries){let im=onlineSprites.get(e.id);if(!im){ensureImage(e.sprite).then(img=>{onlineSprites.set(e.id,img);if(!onlinePlaying)drawOnlineStage(onlineT)}).catch(()=>{});continue}const p=onlinePlaying?animatedLocation(e,t):{x:e.x,y:e.y,rot:0,scale:1};const max=Math.max(im.width,im.height),sz=e.size,ww=sz*im.width/max,hh=sz*im.height/max;let pop=1;const hit=onlineHits.get(e.id);if(hit){const dt=t-hit.start;if(dt<=.8)pop+=.18*Math.sin(Math.PI*dt/.8);else onlineHits.delete(e.id)}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(im,-ww*p.scale*pop/2,-hh*p.scale*pop/2,ww*p.scale*pop,hh*p.scale*pop);ctx.restore()}}
function onlineLoop(timestamp){if(view!=='online-display'||onlineDisplayMode!=='completed'||!onlinePlaying)return;if(onlineLast)onlineT+=Math.min(.06,(timestamp-onlineLast)/1000);onlineLast=timestamp;drawOnlineStage(onlineT);onlineFrame=requestAnimationFrame(onlineLoop)}
function onlinePendingKey(){return 'leaf-v12-pending-'+(online.room||'notjoined')}
function readPending(){try{const v=JSON.parse(localStorage.getItem(onlinePendingKey())||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function addPendingWork(id){if(!online.room)return;const list=readPending();if(!list.includes(id)){list.push(id);localStorage.setItem(onlinePendingKey(),JSON.stringify(list.slice(-200)))}}
function queueOnlineCompleted(work){if(!online.room)return;addPendingWork(work.id);if(canOnlineEdit())flushPendingOnlineWorks().catch(e=>console.warn(e))}
async function smallOnlineSprite(src,max=340){let im=await ensureImage(src);const c=document.createElement('canvas');const r=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png')}
let flushingOnline=false;
async function flushPendingOnlineWorks(){if(flushingOnline||!online.connected||!canOnlineEdit()||online.roomSettings.completedEnabled===false)return;flushingOnline=true;try{for(const id of readPending()){if(!canOnlineEdit())break;const w=works.find(x=>x.id===id);if(!w){localStorage.setItem(onlinePendingKey(),JSON.stringify(readPending().filter(x=>x!==id)));continue}try{let sprite=await smallOnlineSprite(w.sprite,340);if(sprite.length>145000)sprite=await smallOnlineSprite(w.sprite,230);const thumb=w.thumb?.length<100000?w.thumb:await smallOnlineSprite(w.sprite,230);if(sprite.length>180000||thumb.length>125000)throw Error('image-too-large');const entry={id:w.id,authorUid:online.uid,ownerName:(w.ownerName||'친구').slice(0,32),title:(w.title||'낙엽 작품').slice(0,40),intro:(w.intro||'').slice(0,180),thumb,sprite,motion:'float',updatedAt:Date.now()};const old=online.completed[id];if(old?.authorUid===online.uid){entry.motion=old.motion||'float';entry.hidden=!!old.hidden}await online.api.set(online.api.ref(online.db,fbRoomPath('completed/'+id)),entry);localStorage.setItem(onlinePendingKey(),JSON.stringify(readPending().filter(x=>x!==id)));toast('☁️ 온라인 작품도 저장했어요.')}catch(e){online.error=String(e);console.warn('Online publish postponed',e);toast('기기 저장 완료 · 온라인 공유는 재연결 뒤 시도해요.',true);break}}}finally{flushingOnline=false}}
function scheduleOnlineLive(force=false){if(!online.connected||!canOnlineEdit()||online.roomSettings.liveEnabled===false||view!=='studio')return;const elapsed=Date.now()-online.lastSent;if(force&&elapsed>=1800)sendOnlineLive().catch(()=>{});else if(!online.sendTimer){online.sendTimer=setTimeout(()=>{online.sendTimer=null;sendOnlineLive().catch(()=>{})},Math.max(250,1900-elapsed))}}
async function sendOnlineLive(){if(online.sendRunning||!online.connected||!canOnlineEdit()||online.roomSettings.liveEnabled===false||view!=='studio')return;online.sendRunning=true;online.lastSent=Date.now();try{const c=await renderToCanvas(scene,true);let image=downscaledDataURL(c,340,'image/jpeg');if(image.length>88000){const tiny=document.createElement('canvas');tiny.width=250;tiny.height=188;tiny.getContext('2d').drawImage(c,0,0,250,188);image=tiny.toDataURL('image/jpeg',.46)}if(image.length>90000)throw Error('image-too-large');const payload={image,name:ownerLabel(ownerId).slice(0,32),updatedAt:Date.now(),ownerId:String(ownerId).slice(0,80),workId:currentWorkId||''};await online.api.set(online.api.ref(online.db,fbRoomPath('live/'+online.uid)),payload)}catch(e){online.error=String(e);onlineSafeRender()}finally{online.sendRunning=false}}

// Global actions and controls. Interactions use actual buttons, pointer events, and native input elements.
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,id=el.dataset.id;try{switch(a){case 'online-room':setView('online-room');break;case 'online-display':onlineDisplayMode=el.dataset.mode||onlineDisplayMode;setView('online-display');break;case 'online-config-save':await saveOnlineConfig();break;case 'online-connect':await initOnline();break;case 'online-teacher-login':await onlineTeacherLogin();break;case 'online-new-room':await onlineCreateRoom();break;case 'online-teacher-reconnect':await onlineTeacherReconnect();break;case 'online-export-html':await onlineExportHTML();break;case 'online-room-enter':await onlineJoinRoom();break;case 'online-leave':await onlineLeave();break;case 'online-approve':await onlineApprove(id,el.dataset.role);break;case 'online-revoke':await onlineRevoke(id);break;case 'online-share-local':confirmAction('이 기기의 작품 온라인 공유','이 기기에 저장된 완성 작품을 현재 학급 온라인 전시에 모두 공유할까요? 별명과 작품 이미지가 학급 기기에 보여요.',async()=>{for(const w of works)addPendingWork(w.id);closeModal();flushPendingOnlineWorks().catch(()=>{});toast('온라인 공유 대기 목록에 넣었어요.')});break;case 'online-reject':await onlineReject(id);break;case 'online-toggle-live':await onlineToggle('liveEnabled');break;case 'online-toggle-completed':await onlineToggle('completedEnabled');break;case 'online-hide':await onlineHide(id,el.dataset.hidden==='true');break;case 'online-mode-live':onlineDisplayMode='live';setView('online-display');break;case 'online-mode-completed':onlineDisplayMode='completed';setView('online-display');break;case 'online-replay':onlinePlaying=!onlinePlaying;render();break;case 'online-page-prev':onlinePage=Math.max(0,onlinePage-1);render();break;case 'online-page-next':onlinePage++;render();break;case 'online-live-zoom':onlineZoom(id);break;case 'online-copy-code':if(online.room){try{await navigator.clipboard.writeText(online.room);toast('방 코드를 복사했어요.')}catch(e){toast('방 코드: '+online.room)}}break;case 'home':if(view==='studio')await flushDraft();if(view==='stage')await persistStage();setView('home');break;case 'gallery':if(view==='studio')await flushDraft();setView('gallery');break;case 'observe-only':observing='leaf-maple-red';setView('observe');break;case 'observe-select':observing=id;setView('observe');break;case 'start-new':await beginNew();break;case 'continue':await resume();break;case 'to-studio':setView('studio');break;case 'studio':setView('studio');break;case 'detail':await flushDraft();setView('detail');break;case 'stage':if(view==='studio')await flushDraft();if(view==='stage')await persistStage();stageCurrentOrAdd();break;case 'stage-mode':await persistStage();stageMode=el.dataset.mode;stageCurrentOrAdd();break;case 'mode':studioMode=el.dataset.mode;selectedElement=null;render();break;case 'palette-tab':studioTab=el.dataset.tab;render();break;case 'deco-filter':decoFilter=id;render();break;case 'color':brushColor=el.dataset.color;render();break;case 'add-asset':addMaterial(id);break;case 'deselect':selectedElement=null;renderStudioCanvas();refreshStudioControls();break;case 'undo':undo();break;case 'redo':redo();break;case 'clear-scene':confirmAction('현재 작품만 초기화','현재 도화지의 낙엽과 그림만 지울까요? 교사가 등록한 자료, 친구 명단과 저장된 완성 작품은 지워지지 않아요.',async()=>{mutate(()=>{scene.elements=[];scene.strokes=[];selectedElement=null});render()});break;case 'size-down':case 'size-up':case 'rotate-left':case 'rotate-right':case 'flip':case 'duplicate':case 'delete-selected':case 'front':case 'back':case 'left':case 'right':case 'up':case 'down':transformSelected(a);break;case 'save-work':await saveWork();break;case 'png':await downloadPNG(scene,el.dataset.bg==='yes',$('work-title')?.value.trim()||'내_작품');break;case 'view-work':workModal(id);break;case 'edit-work':await editWork(id);break;case 'copy-work':await editWork(id,true);break;case 'download-work':{let w=works.find(w=>w.id===id);if(w)await downloadPNG(w.scene,true,w.title);break}case 'stage-add-toggle':stageAddOpen=!stageAddOpen;render();break;case 'stage-add':{const w=works.find(x=>x.id===id);if(!w)return;stage.entries.push({id:uid(),workId:w.id,x:W/2+(Math.random()-.5)*200,y:H/2+(Math.random()-.5)*140,size:250,motion:'float',speed:1,phase:Math.random()*6});stageSelected=stage.entries.at(-1).id;stageAddOpen=false;markStage();render();break}case 'stage-play':stagePlaying=!stagePlaying;stageLast=0;render();break;case 'stage-smaller':case 'stage-bigger':{const e=stage.entries.find(x=>x.id===stageSelected);if(e){e.size=Math.max(60,Math.min(650,e.size*(a==='stage-bigger'?1.15:.87)));markStage();render()}break}case 'stage-remove':confirmAction('전시에서 빼기','이 작품을 현재 움직이는 전시에서만 뺄까요? 원본 작품은 그대로 유지됩니다.',async()=>{stage.entries=stage.entries.filter(x=>x.id!==stageSelected);stageSelected=null;markStage();render()});break;case 'stage-png':await exportStage();break;case 'admin-enter':await adminEnter();break;case 'admin-lock':teacherUnlocked=false;setView('home');break;case 'admin-tab':adminTab=el.dataset.tab;render();break;case 'settings-save':{settings.title=$('setting-title').value.trim()||defaultSettings.title;settings.guide=$('setting-guide').value.trim()||defaultSettings.guide;await dbPut('settings',settings);toast('설정을 저장했어요.');render();break}case 'pin-change':{const pin=$('new-pin').value;if(!/^\d{4}$/.test(pin)){toast('새 PIN 숫자 4자리를 입력해 주세요.',true);break}confirmAction('교사 PIN 변경','관리 화면에 들어올 때 사용할 PIN을 변경할까요?',async()=>{settings.pinHash=hashPin(pin);await dbPut('settings',settings);toast('PIN이 바뀌었어요.');render()});break}case 'kid-add':{const names=$('kid-bulk').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).slice(0,120);if(!names.length){toast('추가할 이름을 입력해 주세요.',true);break}for(const name of names){let kid={id:uid(),name:name.slice(0,35)};await dbPut('kids',kid);kids.push(kid)}toast(names.length+'명 등록했어요.');render();break}case 'kid-rename':{let k=getKid(id);if(!k)return;modal('이름 바꾸기',`<label class="field">새 이름<input id="new-kidname" value="${esc(k.name)}" maxlength="35"></label>`,[{name:'취소',action:closeModal},{name:'저장',style:'primary',action:async()=>{const n=$('new-kidname').value.trim();if(!n)return toast('이름을 입력해 주세요.',true);k.name=n;await dbPut('kids',k);closeModal();render()}}]);break}case 'kid-delete':{const k=getKid(id);if(!k)return;if(works.some(w=>w.ownerId===id)||drafts.some(d=>d.ownerId===id)){toast('이 친구의 작품이 있어요. 작품을 먼저 백업하거나 삭제한 뒤 명단을 정리해 주세요.',true);break}confirmAction('명단에서 삭제',`<b>${esc(k.name)}</b> 친구만 명단에서 삭제할까요? 다른 자료는 바뀌지 않아요.`,async()=>{await dbDel('kids',id);kids=kids.filter(q=>q.id!==id);if(ownerId===id)ownerId='guest';render()});break}case 'upload-save':{const src=$('upload-preview')?.dataset.image,name=$('upload-name').value.trim(),category=$('upload-category').value;if(!src||!name){toast('사진과 자료 이름을 확인해 주세요.',true);break}const r={id:'asset-'+uid(),category,name:name.slice(0,42),src,createdAt:now()};await dbPut('assets',r);assets.push(r);toast('이미지를 등록했어요.');render();break}case 'asset-delete':{const r=assets.find(x=>x.id===id);if(!r)return;if(materialUsed(id)){toast('이 자료를 사용한 작품이나 전시가 있어 삭제할 수 없어요.',true);break}confirmAction('등록 자료 삭제',`<b>${esc(r.name)}</b> 이미지를 삭제할까요?`,async()=>{await dbDel('assets',id);assets=assets.filter(x=>x.id!==id);render()});break}case 'backup':await backup();break;case 'restore-check':await restoreFile();break;case 'delete-owner-works':{const who=$('delete-owner').value;confirmAction('친구 작품만 삭제',`<b>${esc(ownerLabel(who))}</b>의 완성 작품과 임시 작품을 모두 삭제할까요? 등록한 사진·배경·명단·설정은 남습니다.`,()=>deleteWorksOf(who));break}case 'delete-all':deleteEverything();break;default:break}}catch(e){console.error(e);toast('처리하지 못했어요: '+(e.message||'다시 눌러 주세요.'),true)}});
document.addEventListener('click',ev=>{if(ev.target.closest('#materials-details summary'))materialsOpen=!materialsOpen});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='owner-select'){ownerId=t.value;render()}else if(t.id==='gallery-filter'){galleryFilter=t.value;render()}else if(t.id==='bg-select'){mutate(()=>{scene.bgId=t.value});renderStudioCanvas()}else if(t.id==='stage-bg'){stage.bgId=t.value;markStage();repaintStage()}else if(t.id==='motion-select'){const e=stage?.entries.find(q=>q.id===stageSelected);if(e){e.motion=t.value;markStage();drawStage(0)}}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='brush-size')brushSize=Number(t.value);if(t.id==='motion-speed'){const e=stage?.entries.find(q=>q.id===stageSelected);if(e){e.speed=Number(t.value);markStage()}}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-online-motion]'))onlineSetMotion(t.dataset.onlineMotion,t.value)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(saveTimer)persistDraft();if(stageTimer)persistStage()}});
window.addEventListener('beforeunload',e=>{if(saveTimer||stageTimer){/* IndexedDB writes are asynchronous. Save debounced edits before navigating away when possible. */if(saveTimer)persistDraft();if(stageTimer)persistStage()}});
async function init(){try{db=await dbOpen();await reloadData();ownerId='guest';render();initOnline().catch(e=>console.warn('Online optional:',e))}catch(e){console.error(e);$('app').innerHTML='<div class="shell"><div class="panel stack"><h2>🍂 저장 공간을 열 수 없어요</h2><p>이 브라우저에서 IndexedDB 저장이 차단됐을 수 있어요. 일반 브라우저에서 파일을 다시 열거나 게시 사이트로 접속해 주세요. 저장 없이 활동을 시작하도록 안내하지 않습니다.</p><p class="muted">'+esc(e.message)+'</p></div></div>'}}
init();
})();
