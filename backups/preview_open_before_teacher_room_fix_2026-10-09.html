function dbOpen(){return new Promise((ok,no)=>{const req=indexedDB.open(activeDbName,1);req.onupgradeneeded=()=>{for(const s of STORES)if(!req.result.objectStoreNames.contains(s))req.result.createObjectStore(s,{keyPath:'id'})};req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
function dbGetAll(store){return new Promise((ok,no)=>{const t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbPut(store,record){return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.objectStore(store).put(record)})}
function dbDel(store,id){return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.objectStore(store).delete(id)})}
function dbReplaceAll(data){return new Promise((ok,no)=>{const t=db.transaction(STORES,'readwrite');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);for(const s of STORES){let store=t.objectStore(s);store.clear();for(const record of data[s])store.put(record)}})}

async function switchLocalRoom(code,mode='artist'){
 if(code!==''&&!roomCodeOK(code)){toast('방 코드는 영문·숫자 6자리로 입력해 주세요.',true);return}
 const epoch=++roomConnectionEpoch;
 currentEntryMode=mode==='viewer'?'viewer':'artist';
 while(saveBusy)await new Promise(r=>setTimeout(r,40));if(saveTimer)await flushDraft();while(saveBusy)await new Promise(r=>setTimeout(r,40));if(stageTimer)await persistStage();
 // Switching a classroom disconnects its listeners, but never removes another classroom's stored works.
 if(online.room&&online.room!==code){
  // No draft channel to clean up.
  resetOnlineListeners();if(online.pendingMember){online.pendingMember();online.pendingMember=null}
  online.room='';online.role='none';online.error='';online.status='연결 준비';
 }
 if(db){db.close();db=null}
 activeRoomCode=code;activeDbName=code?DB_NAME+'-room-'+code:DB_NAME;
 try{
  db=await dbOpen();await reloadData();localStorage.setItem(ROOM_STORAGE_KEY,code);
  ownerId='guest';scene=freshScene();currentWorkId=null;selectedElement=null;history=[];future=[];stage=null;teacherUnlocked=false;adminTab='settings';studioMode='move';
  if(!code){setView('home');toast('이전 개인 저장 공간을 열었어요.');return}
  online.status='자동 연결 중';online.error='';
  setView(currentEntryMode==='viewer'?'online-display':'home');
  connectRoomOnEntry(code,currentEntryMode,epoch).catch(e=>{if(epoch!==roomConnectionEpoch)return;online.error=String(e);online.status='연결 실패';toast(firebaseMessage(e),true);onlineSafeRender()});
 }catch(e){console.error(e);toast('반별 저장 공간을 열지 못했어요. 다시 시도해 주세요.',true);setView('room-gate')}
}
function createLocalRoomCode(){const c=randomRoomCode();pendingNewRoomCode=c;const input=$('local-room-input');if(input){input.value=c;input.focus();input.select()}toast('새 방 코드 '+c+'를 만들었어요. 입장하면 온라인 방도 자동으로 만들어요.')}

/**
 * A single room-code entry opens both this device's IndexedDB classroom
 * and the RTDB classroom. Unknown manually typed codes are never claimed
 * as teacher rooms. Only an explicit "새 방 코드 만들기" action may create one.
 */
async function connectRoomOnEntry(code,mode='artist',epoch=roomConnectionEpoch){
 if(!code||activeRoomCode!==code||epoch!==roomConnectionEpoch)return false;
 online.status='자동 연결 중';online.error='';onlineSafeRender();
 const api=await initOnline();
 if(!api||!online.auth?.currentUser){if(epoch===roomConnectionEpoch){online.status='연결 실패';online.error=online.error||'auth/operation-not-allowed';onlineSafeRender();if(view==='home')render()}return false}
 const uid=online.auth.currentUser.uid;
 if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
 try{
  const base=`rooms/${code}`;
  const exists=await api.get(api.ref(online.db,base+'/createdAt'));
  if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
  if(!exists.exists()){
   if(pendingNewRoomCode!==code){
    online.status='온라인 방 없음';online.error='온라인 방이 아직 만들어지지 않았어요.';
    onlineSafeRender();if(view==='home')render();return false;
   }
   const payload={teacherUid:uid,createdAt:api.serverTimestamp(),members:{[uid]:{role:'teacher',name:'선생님 기기'}},settings:{liveEnabled:false,completedEnabled:true}};
   await api.set(api.ref(online.db,base),payload);
   if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
   pendingNewRoomCode='';
   online.role='teacher';online.alias='선생님 기기';
  }else{
   const member=await api.get(api.ref(online.db,base+'/members/'+uid));
   if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
   if(member.val()?.role==='teacher'){
    online.role='teacher';online.alias='선생님 기기';
   }else{
    const role=mode==='viewer'?'viewer':'artist';
    const alias=role==='viewer'?'전자칠판':'작품 태블릿 '+uid.slice(0,4);
    await api.set(api.ref(online.db,base+'/members/'+uid),{role,name:alias});
    if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
    online.role=role;online.alias=alias;
   }
  }
  if(online.room!==code)resetOnlineListeners();
  online.uid=uid;online.room=code;online.error='';online.status='연결됨';
  localStorage.setItem(ONLINE_ROOM_KEY,code);
  await onlineStartRoomListeners();
  if(epoch!==roomConnectionEpoch||activeRoomCode!==code)return false;
  if(mode==='viewer'&&view!=='online-display')setView('online-display');
  onlineSafeRender();
  if(view==='home')render();
  return true;
 }catch(e){
  if(epoch===roomConnectionEpoch&&activeRoomCode===code){online.error=String(e);online.status='연결 실패';toast(firebaseMessage(e),true);onlineSafeRender();if(view==='home')render()}
  return false;
 }

 class="panel"><h3 class="panel-title">현재 명단 (${kids.length}명)</h3>${kids.map(k=>`<div class="listrow"><strong>${esc(k.name)}</strong><div class="row"><button class="btn small" data-act="kid-rename" data-id="${esc(k.id)}">이름 수정</button><button class="btn danger small" data-act="kid-delete" data-id="${esc(k.id)}">명단 삭제</button></div></div>`).join('')||'<div class="empty">등록된 친구가 없어요.</div>'}</section></div>`:adminTab==='assets'?`<div class="panel stack"><h3 class="panel-title">낙엽·꾸미기·배경 이미지 등록</h3><div class="notice">JPG·PNG·투명 PNG를 지원해요. 일반 사진은 배경까지 함께 등록돼요. 자동 배경 제거는 지원하지 않으니 투명 PNG를 사용해 주세요. 큰 이미지는 비율을 유지하며 축소해 저장합니다.</div><div class="columns"><label class="field">자료 종류<select id="upload-category"><option value="leaf">낙엽</option><option value="deco">꾸미기 재료</option><option value="bg">배경</option></select></label><label class="field">자료 이름<input id="upload-name" maxlength="42" placeholder="예: 우리 동네 단풍잎"></label></div><label class="field">사진 선택<input id="upload-file" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><div id="upload-preview" class="muted">파일을 고르면 미리보기가 나와요.</div><button class="btn primary" data-act="upload-save">이미지 등록하기</button><h3 class="panel-title">등록한 자료 (${assets.length}개)</h3><div class="asset-manager">${assets.map(a=>`<div class="asset-mini"><img src="${a.src}" alt="${esc(a.name)}"><span class="name">${esc(a.name)}</span><span class="micro">${a.category==='bg'?'배경':a.category==='leaf'?'낙엽':'꾸미기'}</span><button class="btn danger small full" data-act="asset-delete" data-id="${esc(a.id)}">삭제</button></div>`).join('')||'<p class="muted">교사가 추가한 자료가 아직 없어요.</p>'}</div><div class="muted">기본 낙엽과 꾸미기 그림은 HTML에 내장되어 있어 삭제되지 않습니다.</div></div>`:`<div class="columns"><section class="panel stack"><h3 class="panel-title">전체 데이터 백업·복원</h3><div class="notice">백업 JSON에 앱 제목·안내·명단·등록 이미지·작품·임시 작품·움직이는 전시가 모두 포함됩니다.</div><button class="btn green full" data-act="backup">⬇️ 전체 자료 백업 (.json)</button><label class="field">백업 파일 불러오기<input id="restore-file" type="file" accept=".json,application/json"></label><button class="btn soft full" data-act="restore-check">🔁 백업 파일 검증·복원</button><div class="muted">병합: 같은 고유번호의 기존 자료를 우선 보존합니다. 교체: 현재 데이터를 모두 지우고 백업으로 바꿉니다.</div></section><section class="panel stack"><h3 class="panel-title">초기화 · 삭제 범위</h3><label class="field">작품을 삭제할 친구<select id="delete-owner"><option value="guest">체험 친구</option>${kids.map(k=>`<option value="${esc(k.id)}">${esc(k.name)}</option>`).join('')}</select></label><button class="btn danger full" data-act="delete-owner-works">선택한 유아의 작품만 삭제</button><div class="muted">유아의 완성 작품과 임시 작품을 삭제하며 등록 자료·명단·설정은 유지합니다.</div><hr style="border:0;border-top:1px solid #e9d9c7;width:100%"><button class="btn danger full" data-act="delete-all">⚠️ 전체 데이터 초기화</button><div class="muted">모든 유아·작품·사진·설정·전시 데이터가 삭제됩니다. 백업 후 진행하세요.</div></section></div>`}${footer()}`}
function render(){let html=({'room-gate':roomGate,home,observe,studio,detail,gallery,stage:stageUI,admin,'online-room':onlineRoomUI,'online-display':onlineDisplayUI})[view]();$('app').innerHTML=`<div class="shell">${html}</div>`;if(view==='studio'){setupStudioPointer();renderStudioCanvas();saveStatus('✓ 자동 저장 사용 중')}if(view==='detail'){ensureAll(scene).then(()=>{let c=$('detail-canvas');if(c)paintScene(c.getContext('2d'),scene,true,false)})}if(view==='stage'){setupStagePointer();repaintStage()}if(view==='admin'&&adminTab==='assets')setupUploadPreview();if(view==='online-display')prepareOnlineDisplay()}
function ensureImage(src){if(!src)return Promise.reject(Error('no image'));let entry=imgCache.get(src);if(entry)return entry.promise;const image=new Image(),promise=new Promise((ok,no)=>{image.onload=()=>ok(image);image.onerror=()=>no(Error('이미지 불러오기 실패'));image.src=src});imgCache.set(src,{image,promise,ready:false});promise.then(()=>{imgCache.get(src).ready=true;if(view==='studio')renderStudioCanvas();if(view==='stage')repaintStage()},()=>imgCache.delete(src));return promise}
function loaded(src){let item=imgCache.get(src);if(!item){ensureImage(src).catch(()=>{});return null}return item.ready?item.image:null}
async function ensureAll(s){await Promise.all([...new Set([...(s.elements||[]).map(e=>getAsset(e.assetId)?.src),assets.find(a=>a.id===s.bgId)?.src].filter(Boolean))].map(ensureImage))}
function fillBackground(ctx,id){ctx.save();const bg=assets.find(a=>a.id===id&&a.category==='bg');if(bg){const im=loaded(bg.src);ctx.fillStyle='#f4f0e8';ctx.fillRect(0,0,W,H);if(im){let scale=Math.max(W/im.width,H/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h)}ctx.restore();return}
const bands={paper:['#fffaf0','#f8e9d5'],museum:['#f3ede2','#d5c2ad'],forest:['#d9e1c0','#fae5b6'],sky:['#bed9ed','#fbe0c4'],pond:['#b8dcd8','#deeacf'],meadow:['#f3e2bb','#bdd9ac']};const colors=bands[id]||bands.paper;let gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,colors[0]);gradient.addColorStop(1,colors[1]);ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
if(id==='museum'){const wall=ctx.createLinearGradient(0,0,0,H*.68);wall.addColorStop(0,'#efe5d8');wall.addColorStop(.55,'#dccbb7');wall.addColorStop(1,'#c7b199');ctx.fillStyle=wall;ctx.fillRect(0,0,W,H*.68);const floor=ctx.createLinearGradient(0,H*.68,0,H);floor.addColorStop(0,'#9a7658');floor.addColorStop(.45,'#7d5d46');floor.addColorStop(1,'#654834');ctx.fillStyle=floor;ctx.fillRect(0,H*.68,W,H*.32);for(let i=0;i<10;i++){const x=i*(W/9);ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,H*.68);ctx.lineTo(x-25,H);ctx.stroke()}for(let i=0;i<4;i++){const cx=140+i*220;const light=ctx.createRadialGradient(cx,96,10,cx,180,210);light.addColorStop(0,'rgba(255,248,223,.85)');light.addColorStop(.32,'rgba(255,241,203,.28)');light.addColorStop(1,'rgba(255,235,190,0)');ctx.fillStyle=light;ctx.beginPath();ctx.arc(cx,192,210,0,Math.PI*2);ctx.fill();ctx.fillStyle='#81624d';ctx.fillRect(cx-40,68,80,18);ctx.fillStyle='#f6f1e7';ctx.fillRect(cx-32,86,64,4)}ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.strokeRect(34,34,W-68,H-68)}
if(id==='paper'){ctx.strokeStyle='#dabb8c55';ctx.lineWidth=3;ctx.strokeRect(22,22,W-44,H-44)}
if(id==='forest'||id==='meadow'){ctx.fillStyle='#c4b97277';ctx.beginPath();ctx.ellipse(320,680,530,170,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a7bc8188';ctx.beginPath();ctx.ellipse(790,660,410,170,0,0,Math.PI*2);ctx.fill()}
if(id==='forest'){for(let i=0;i<7;i++){let x=i*160-45,scale=.65+(i%3)*.24;ctx.fillStyle='#92735088';ctx.fillRect(x+40,185,21*scale,340*scale);ctx.fillStyle=['#d6a16c8a','#d5bc6a8a','#be8c6c8a'][i%3];ctx.beginPath();ctx.ellipse(x+50,210,95*scale,137*scale,0,0,Math.PI*2);ctx.fill()}}
if(id==='sky'){ctx.fillStyle='#fff9ecbb';for(let i=0;i<4;i++){let x=80+i*260,y=120+(i%2)*110;ctx.beginPath();ctx.ellipse(x,y,72,27,0,0,7);ctx.ellipse(x+45,y-18,50,34,0,0,7);ctx.ellipse(x+100,y,70,26,0,0,7);ctx.fill()}}
if(id==='pond'){ctx.fillStyle='#76b0aab0';ctx.beginPath();ctx.ellipse(480,540,480,185,0,0,7);ctx.fill();ctx.strokeStyle='#deefdd88';for(let i=0;i<6;i++){ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(140+i*147,515+(i%3)*70,50,11,0,0,7);ctx.stroke()}}
ctx.restore()}
function drawStroke(ctx,s){const pts=s.points||[];if(!pts.length)return;ctx.save();ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.lineWidth=s.size||7;ctx.strokeStyle=s.erase?'rgba(0,0,0,1)':s.color||'#554431';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(pts.length===1)ctx.lineTo(pts[0].x+.05,pts[0].y+.05);else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.restore()}
function paintScene(ctx,s,backgroundOn=true,selectionOn=false){ctx.clearRect(0,0,W,H);if(backgroundOn)fillBackground(ctx,s.bgId);for(const e of s.elements||[]){const a=getAsset(e.assetId),im=a?loaded(a.src):null;if(!im)continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot||0);ctx.scale(e.flip?-1:1,1);ctx.drawImage(im,-e.w/2,-e.h/2,e.w,e.h);ctx.restore()}
const dc=document.createElement('canvas');dc.width=W;dc.height=H;const dctx=dc.getContext('2d');for(const s1 of s.strokes||[])drawStroke(dctx,s1);ctx.drawImage(dc,0,0);
if(selectionOn&&selectedElement){let e=s.elements.find(q=>q.id===selectedElement);if(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot||0);ctx.setLineDash([12,8]);ctx.lineWidth=3;ctx.strokeStyle='#6e8a86';ctx.strokeRect(-e.w/2-7,-e.h/2-7,e.w+14,e.h+14);ctx.restore()}}}
function renderStudioCanvas(){const c=$('studio-canvas');if(c)paintScene(c.getContext('2d'),scene,true,true);positionSelectionTools()}
function refreshStudioControls(){if(view!=='studio')return;for(const b of document.querySelectorAll('[data-act="undo"]'))b.disabled=!history.length;for(const b of document.querySelectorAll('[data-act="redo"]'))b.disabled=!future.length;for(const name of ['size-down','size-up','rotate-left','rotate-right','flip','duplicate','front','back','left','right','up','down','delete-selected'])for(const b of document.querySelectorAll(`[data-act="${name}"]`))b.disabled=!selectedElement;const title=$('selected-name'),e=scene.elements.find(e=>e.id===selectedElement);if(title)title.textContent=e?getAsset(e.assetId)?.name||'재료':'낙엽을 누르면 조절할 수 있어요.';positionSelectionTools()}
function positionSelectionTools(){const bar=$('selection-tools'),canvas=$('studio-canvas');if(!bar||!canvas)return;const e=scene.elements.find(q=>q.id===selectedElement);bar.hidden=!e||studioMode!=='move';if(bar.hidden)return;const width=canvas.clientWidth,height=canvas.clientHeight;const x=e.x/W*width,y=e.y/H*height;const bw=Math.min(310,Math.max(175,width-10));bar.style.width=bw+'px';bar.style.left=Math.max(5,Math.min(width-bw-5,x-bw/2))+'px';bar.style.top=Math.max(8,Math.min(height-60,y-e.h/H*height*.5-56))+'px'}
function pointOnCanvas(ev,c){const r=c.getBoundingClientRect();return {x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
function pickElement(els,px,py){for(let i=els.length-1;i>=0;i--){const e=els[i],dx=px-e.x,dy=py-e.y,a=-(e.rot||0);const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=e.w/2&&Math.abs(ly)<=e.h/2)return e}return null}
function setupStudioPointer(){const c=$('studio-canvas');if(!c)return;c.addEventListener('pointerdown',ev=>{if(ev.button!==0&&ev.pointerType==='mouse')return;ev.preventDefault();c.setPointerCapture(ev.pointerId);const p=pointOnCanvas(ev,c);if(studioMode==='move'){const hit=pickElement(scene.elements,p.x,p.y);selectedElement=hit?.id||null;activePointer={id:ev.pointerId,mode:'move',start:p,initial:hit?{x:hit.x,y:hit.y}:null,old:JSON.stringify(scene),moved:false};renderStudioCanvas();refreshStudioControls()}else{selectedElement=null;const stroke={id:uid(),erase:studioMode==='erase',color:brushColor,size:studioMode==='erase'?brushSize*2.4:brushSize,points:[p]};activePointer={id:ev.pointerId,mode:'stroke',old:JSON.stringify(scene),stroke};scene.strokes.push(stroke);renderStudioCanvas()}});c.addEventListener('pointermove',ev=>{const a=activePointer;if(!a||a.id!==ev.pointerId)return;ev.preventDefault();const p=pointOnCanvas(ev,c);if(a.mode==='move'&&a.initial&&selectedElement){const e=scene.elements.find(e=>e.id===selectedElement);if(e){let dx=p.x-a.start.x,dy=p.y-a.start.y;e.x=Math.min(W+60,Math.max(-60,a.initial.x+dx));e.y=Math.min(H+60,Math.max(-60,a.initial.y+dy));if(Math.abs(dx)+Math.abs(dy)>3)a.moved=true}}else if(a.mode==='stroke'){let pts=a.stroke.points,last=pts.at(-1);if(Math.hypot(last.x-p.x,last.y-p.y)>1.6)pts.push(p)}renderStudioCanvas();scheduleOnlineLive(false)});const end=ev=>{let a=activePointer;if(!a||a.id!==ev.pointerId)return;activePointer=null;try{c.releasePointerCapture(ev.pointerId)}catch(e){}if((a.mode==='move'&&a.moved)||(a.mode==='stroke'))checkpoint(a.old)};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}

function validateBackup(d){if(!d||d.kind!=='leaf-museum-backup'||d.version!==1)throw Error('이 앱에서 만든 1차 백업 파일이 아니에요.');for(const s of STORES)if(!Array.isArray(d[s]))throw Error(s+' 데이터가 없어요.');const limits={kids:2000,assets:350,works:5000,drafts:2000,exhibits:2000,settings:10};for(const s of STORES){if(d[s].length>limits[s])throw Error('백업 항목이 지나치게 많아요.');const seen=new Set();for(const record of d[s]){if(!record||typeof record.id!=='string'||record.id.length>180||seen.has(record.id))throw Error(s+' 고유번호가 올바르지 않아요.');seen.add(record.id)}}for(const a of d.assets){if(!['leaf','deco','bg'].includes(a.category)||typeof a.name!=='string'||!validData(a.src))throw Error('등록 이미지 자료가 올바르지 않아요.')}for(const w of d.works){if(!validScene(w.scene)||typeof w.ownerId!=='string'||typeof w.title!=='string'||!validData(w.thumb)||!validData(w.sprite))throw Error('작품 데이터가 올바르지 않아요.')}for(const x of d.drafts)if(!validScene(x.scene)||typeof x.ownerId!=='string')throw Error('작업 중인 작품 데이터가 올바르지 않아요.');for(const s of d.exhibits)if(!Array.isArray(s.entries)||s.entries.length>500||typeof s.bgId!=='string'||s.entries.some(e=>typeof e.id!=='string'||typeof e.workId!=='string'||!Number.isFinite(e.x)||!Number.isFinite(e.y)||!Number.isFinite(e.size)||!MOTIONS.some(m=>m.id===e.motion)))throw Error('움직이는 전시 데이터가 올바르지 않아요.');for(const k of d.kids)if(typeof k.name!=='string')throw Error('명단이 올바르지 않아요.');for(const st of d.settings)if(st.id!=='main'||typeof st.title!=='string'||typeof st.guide!=='string')throw Error('설정 데이터가 올바르지 않아요.');return true}

async function initOnline(){
 const config=getOnlineConfig();
 if(!config){online.status='설정 필요';online.error='Firebase 웹 설정이 필요해요.';onlineSafeRender();return null}
 try{
  if(!online.api){
   online.status='Firebase 연결 중';
   const [a,b,c]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js')]);
   const app=a.getApps().find(x=>x.name==='leaf-v12')||a.initializeApp(config,'leaf-v12');
   online.auth=b.getAuth(app);online.db=c.getDatabase(app);online.api={...b,...c};
   c.onValue(c.ref(online.db,'.info/connected'),snapshot=>{online.connected=snapshot.val()===true;if(online.connected)flushPendingOnlineWorks().catch(()=>{});onlineSafeRender();});
   b.onAuthStateChanged(online.auth,user=>{online.uid=user?.uid||null;if(!user)online.role='none';onlineSafeRender()});
  }
  // Preserve the teacher's anonymous UID after browser refresh; wait for persistence restoration.
  if(typeof online.auth.authStateReady==='function')await online.auth.authStateReady();
  if(!online.auth.currentUser)await online.api.signInAnonymously(online.auth);
  online.uid=online.auth.currentUser?.uid||null;
  if(!online.uid)throw Error('auth/no-user');
  online.error='';online.status='방 연결 중';onlineSafeRender();return online.api;
 }catch(e){online.error=String(e?.code||e?.message||e);online.status='연결 실패';onlineSafeRender();console.warn('Firebase connect:',e);return null}
}

function onlineZoom(id){const r=online.live[id];if(!r||!/^data:image\/jpeg;base64,/.test(r.image))return;modal('🎨 '+esc(r.name||'친구의 작품'),`<img style="width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:13px;background:#f9efde" src="${esc(r.image)}" alt="작업 중인 낙엽 작품"><p class="muted">새로운 모습을 보려면 창을 닫고 다시 선택해요.</p>`,[{name:'닫기',action:closeModal}])}
function prepareOnlineDisplay(){if(onlineFrame){cancelAnimationFrame(onlineFrame);onlineFrame=0;}if(onlineDisplayMode!=='completed')return;const c=$('online-stage-canvas');if(!c)return;c.addEventListener('pointerdown',e=>{e.preventDefault();const p=pointOnCanvas(e,c),entries=onlineStageEntries();for(let i=entries.length-1;i>=0;i--){const x=animatedLocation(entries[i],onlineT);if(Math.abs(x.x-p.x)<115&&Math.abs(x.y-p.y)<115){onlineHits.set(entries[i].id,{start:onlineT,amount:1});break}}});onlineLast=0;onlineT=0;if(onlinePlaying)onlineFrame=requestAnimationFrame(onlineLoop);else drawOnlineStage(0)}
function onlineStageEntries(){const list=onlineCompletedList().filter(w=>!w.hidden).slice(onlinePage*12,(onlinePage+1)*12);return list.map((w,i)=>({id:w.id,sprite:w.sprite,x:125+(i%4)*235,y:125+Math.floor(i/4)*230,size:180,motion:MOTIONS.some(m=>m.id===w.motion)?w.motion:'float',speed:.65,phase:i*1.618}))}
function drawOnlineStage(t){const c=$('online-stage-canvas');if(!c||view!=='online-display'||onlineDisplayMode!=='completed')return;const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);fillBackground(ctx,'museum');const entries=onlineStageEntries();for(const e of entries){let im=onlineSprites.get(e.id);if(!im){ensureImage(e.sprite).then(img=>{onlineSprites.set(e.id,img);if(!onlinePlaying)drawOnlineStage(onlineT)}).catch(()=>{});continue}const p=onlinePlaying?animatedLocation(e,t):{x:e.x,y:e.y,rot:0,scale:1};const max=Math.max(im.width,im.height),sz=e.size,ww=sz*im.width/max,hh=sz*im.height/max;let pop=1;const hit=onlineHits.get(e.id);if(hit){const dt=t-hit.start;if(dt<=.8)pop+=.18*Math.sin(Math.PI*dt/.8);else onlineHits.delete(e.id)}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(im,-ww*p.scale*pop/2,-hh*p.scale*pop/2,ww*p.scale*pop,hh*p.scale*pop);ctx.restore()}}
function onlineLoop(timestamp){if(view!=='online-display'||onlineDisplayMode!=='completed'||!onlinePlaying)return;if(onlineLast)onlineT+=Math.min(.06,(timestamp-onlineLast)/1000);onlineLast=timestamp;drawOnlineStage(onlineT);onlineFrame=requestAnimationFrame(onlineLoop)}
function onlinePendingKey(){return 'leaf-v12-pending-'+(activeRoomCode||online.room||'notjoined')}
function readPending(){try{const v=JSON.parse(localStorage.getItem(onlinePendingKey())||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function addPendingWork(id){if(!activeRoomCode)return;const list=readPending();if(!list.includes(id)){list.push(id);localStorage.setItem(onlinePendingKey(),JSON.stringify(list.slice(-200)))}}
function queueOnlineCompleted(work){if(!activeRoomCode)return;addPendingWork(work.id);if(canOnlineEdit())flushPendingOnlineWorks().catch(e=>console.warn(e))}
async function smallOnlineSprite(src,max=340){let im=await ensureImage(src);const c=document.createElement('canvas');const r=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png')}

async function flushPendingOnlineWorks(){if(flushingOnline||!online.connected||!canOnlineEdit()||online.roomSettings.completedEnabled===false)return;flushingOnline=true;try{for(const id of readPending()){if(!canOnlineEdit())break;const w=works.find(x=>x.id===id);if(!w){localStorage.setItem(onlinePendingKey(),JSON.stringify(readPending().filter(x=>x!==id)));continue}try{let sprite=await smallOnlineSprite(w.sprite,340);if(sprite.length>145000)sprite=await smallOnlineSprite(w.sprite,230);const thumb=w.thumb?.length<100000?w.thumb:await smallOnlineSprite(w.sprite,230);if(sprite.length>180000||thumb.length>125000)throw Error('image-too-large');const entry={id:w.id,authorUid:online.uid,ownerName:(online.alias||'친구의 작품').slice(0,32),title:(w.title||'낙엽 작품').slice(0,40),intro:(w.intro||'').slice(0,180),thumb,sprite,motion:'float',updatedAt:Date.now()};const old=online.completed[id];if(old?.authorUid===online.uid){entry.motion=old.motion||'float';entry.hidden=!!old.hidden}await online.api.set(online.api.ref(online.db,fbRoomPath('completed/'+id)),entry);localStorage.setItem(onlinePendingKey(),JSON.stringify(readPending().filter(x=>x!==id)));toast('☁️ 온라인 작품도 저장했어요.')}catch(e){online.error=String(e);console.warn('Online publish postponed',e);toast('기기 저장 완료 · 온라인 공유는 재연결 뒤 시도해요.',true);break}}}finally{flushingOnline=false}}

document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,id=el.dataset.id;try{switch(a){case 'local-room-enter':{const code=($('local-room-input')?.value||'').trim().toUpperCase();await switchLocalRoom(code,'artist');break}case 'local-room-viewer':{const code=($('local-room-input')?.value||'').trim().toUpperCase();onlineDisplayMode='completed';await switchLocalRoom(code,'viewer');break}case 'online-retry':if(activeRoomCode){const epoch=++roomConnectionEpoch;await connectRoomOnEntry(activeRoomCode,currentEntryMode,epoch)}break;case 'local-room-create':createLocalRoomCode();break;case 'local-room-legacy':await switchLocalRoom('');break;case 'room-switch':if(view==='studio')await flushDraft();if(view==='stage')await persistStage();setView('room-gate');break;case 'leaf-filter':leafFilter=id;render();break;case 'online-room':setView('online-room');break;case 'online-display':onlineDisplayMode='completed';setView('online-display');break;case 'online-config-save':await saveOnlineConfig();break;case 'online-connect':await initOnline();break;case 'online-teacher-login':await onlineTeacherLogin();break;case 'online-new-room':await onlineCreateRoom();break;case 'online-teacher-reconnect':await onlineTeacherReconnect();break;case 'online-export-html':await onlineExportHTML();break;case 'online-room-enter':await onlineJoinRoom();break;case 'online-leave':await onlineLeave();break;case 'online-approve':await onlineApprove(id,el.dataset.role);break;case 'online-revoke':await onlineRevoke(id);break;case 'online-share-local':confirmAction('이 기기의 작품 온라인 공유','이 기기에 저장된 완성 작품을 현재 학급 온라인 전시에 모두 공유할까요? 별명과 작품 이미지가 학급 기기에 보여요.',async()=>{for(const w of works)addPendingWork(w.id);closeModal();flushPendingOnlineWorks().catch(()=>{});toast('온라인 공유 대기 목록에 넣었어요.')});break;case 'online-reject':await onlineReject(id);break;case 'online-toggle-live':await onlineToggle('liveEnabled');break;case 'online-toggle-completed':await onlineToggle('completedEnabled');break;case 'online-hide':await onlineHide(id,el.dataset.hidden==='true');break;case 'online-mode-live':onlineDisplayMode='completed';setView('online-display');break;case 'online-mode-completed':onlineDisplayMode='completed';setView('online-display');break;case 'online-replay':onlinePlaying=!onlinePlaying;render();break;case 'online-page-prev':onlinePage=Math.max(0,onlinePage-1);render();break;case 'online-page-next':onlinePage++;render();break;case 'online-live-zoom':onlineZoom(id);break;case 'online-copy-code':if(online.room){try{await navigator.clipboard.writeText(online.room);toast('방 코드를 복사했어요.')}catch(e){toast('방 코드: '+online.room)}}break;case 'home':if(view==='studio')await flushDraft();if(view==='stage')await persistStage();setView('home');break;case 'gallery':if(view==='studio')await flushDraft();setView('gallery');break;case 'online-view-work':showSharedWork(id);break;case 'observe-only':observing='leaf-botanical-maple-red';setView('observe');break;case 'observe-select':observing=id;setView('observe');break;case 'start-new':await beginNew();break;case 'continue':await resume();break;case 'to-studio':setView('studio');break;case 'studio':setView('studio');break;case 'detail':await flushDraft();setView('detail');break;case 'stage':if(view==='studio')await flushDraft();if(view==='stage')await persistStage();if(activeRoomCode){onlineDisplayMode='completed';setView('online-display')}else stageCurrentOrAdd();break;case 'stage-local':if(view==='studio')await flushDraft();stageCurrentOrAdd();break;case 'stage-mode':await persistStage();stageMode=el.dataset.mode;stageCurrentOrAdd();break;case 'mode':studioMode=el.dataset.mode;selectedElement=null;render();break;case 'palette-tab':studioTab=el.dataset.tab;render();break;case 'deco-filter':decoFilter=id;render();break;case 'color':brushColor=el.dataset.color;render();break;case 'add-asset':addMaterial(id);break;case 'deselect':selectedElement=null;renderStudioCanvas();refreshStudioControls();break;case 'undo':undo();break;case 'redo':redo();break;case 'clear-scene':confirmAction('현재 작품만 초기화','현재 도화지의 낙엽과 그림만 지울까요? 교사가 등록한 자료, 친구 명단과 저장된 완성 작품은 지워지지 않아요.',async()=>{mutate(()=>{scene.elements=[];scene.strokes=[];selectedElement=null});render()});break;case 'size-down':case 'size-up':case 'rotate-left':case 'rotate-right':case 'flip':case 'duplicate':case 'delete-selected':case 'front':case 'back':case 'left':case 'right':case 'up':case 'down':transformSelected(a);break;case 'save-work':await saveWork();break;case 'png':await downloadPNG(scene,el.dataset.bg==='yes',$('work-title')?.value.trim()||'내_작품');break;case 'view-work':workModal(id);break;case 'edit-work':await editWork(id);break;case 'copy-work':await editWork(id,true);break;case 'download-work':{let w=works.find(w=>w.id===id);if(w)await downloadPNG(w.scene,true,w.title);break}case 'stage-add-toggle':stageAddOpen=!stageAddOpen;render();break;case 'stage-add':{const w=works.find(x=>x.id===id);if(!w)return;stage.entries.push({id:uid(),workId:w.id,x:W/2+(Math.random()-.5)*200,y:H/2+(Math.random()-.5)*140,size:250,motion:'float',speed:1,phase:Math.random()*6});stageSelected=stage.entries.at(-1).id;stageAddOpen=false;markStage();render();break}case 'stage-play':stagePlaying=!stagePlaying;stageLast=0;render();break;case 'stage-smaller':case 'stage-bigger':{const e=stage.entries.find(x=>x.id===stageSelected);if(e){e.size=Math.max(60,Math.min(650,e.size*(a==='stage-bigger'?1.15:.87)));markStage();render()}break}case 'stage-remove':confirmAction('전시에서 빼기','이 작품을 현재 움직이는 전시에서만 뺄까요? 원본 작품은 그대로 유지됩니다.',async()=>{stage.entries=stage.entries.filter(x=>x.id!==stageSelected);stageSelected=null;markStage();render()});break;case 'stage-png':await exportStage();break;case 'admin-enter':await adminEnter();break;case 'admin-lock':teacherUnlocked=false;setView('home');break;case 'admin-tab':adminTab=el.dataset.tab;render();break;case 'settings-save':{settings.title=$('setting-title').value.trim()||defaultSettings.title;settings.guide=$('setting-guide').value.trim()||defaultSettings.guide;await dbPut('settings',settings);toast('설정을 저장했어요.');render();break}case 'pin-change':{const pin=$('new-pin').value;if(!/^\d{4}$/.test(pin)){toast('새 PIN 숫자 4자리를 입력해 주세요.',true);break}confirmAction('교사 PIN 변경','관리 화면에 들어올 때 사용할 PIN을 변경할까요?',async()=>{settings.pinHash=hashPin(pin);await dbPut('settings',settings);toast('PIN이 바뀌었어요.');render()});break}case 'kid-add':{const names=$('kid-bulk').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).slice(0,120);if(!names.length){toast('추가할 이름을 입력해 주세요.',true);break}for(const name of names){let kid={id:uid(),name:name.slice(0,35)};await dbPut('kids',kid);kids.push(kid)}toast(names.length+'명 등록했어요.');render();break}case 'kid-rename':{let k=getKid(id);if(!k)return;modal('이름 바꾸기',`<label class="field">새 이름<input id="new-kidname" value="${esc(k.name)}" maxlength="35"></label>`,[{name:'취소',action:closeModal},{name:'저장',style:'primary',action:async()=>{const n=$('new-kidname').value.trim();if(!n)return toast('이름을 입력해 주세요.',true);k.name=n;await dbPut('kids',k);closeModal();render()}}]);break}case 'kid-delete':{const k=getKid(id);if(!k)return;if(works.some(w=>w.ownerId===id)||drafts.some(d=>d.ownerId===id)){toast('이 친구의 작품이 있어요. 작품을 먼저 백업하거나 삭제한 뒤 명단을 정리해 주세요.',true);break}confirmAction('명단에서 삭제',`<b>${esc(k.name)}</b> 친구만 명단에서 삭제할까요? 다른 자료는 바뀌지 않아요.`,async()=>{await dbDel('kids',id);kids=kids.filter(q=>q.id!==id);if(ownerId===id)ownerId='guest';render()});break}case 'upload-save':{const src=$('upload-preview')?.dataset.image,name=$('upload-name').value.trim(),category=$('upload-category').value;if(!src||!name){toast('사진과 자료 이름을 확인해 주세요.',true);break}const r={id:'asset-'+uid(),category,name:name.slice(0,42),src,createdAt:now()};await dbPut('assets',r);assets.push(r);toast('이미지를 등록했어요.');render();break}case 'asset-delete':{const r=assets.find(x=>x.id===id);if(!r)return;if(materialUsed(id)){toast('이 자료를 사용한 작품이나 전시가 있어 삭제할 수 없어요.',true);break}confirmAction('등록 자료 삭제',`<b>${esc(r.name)}</b> 이미지를 삭제할까요?`,async()=>{await dbDel('assets',id);assets=assets.filter(x=>x.id!==id);render()});break}case 'backup':await backup();break;case 'restore-check':await restoreFile();break;case 'delete-owner-works':{const who=$('delete-owner').value;confirmAction('친구 작품만 삭제',`<b>${esc(ownerLabel(who))}</b>의 완성 작품과 임시 작품을 모두 삭제할까요? 등록한 사진·배경·명단·설정은 남습니다.`,()=>deleteWorksOf(who));break}case 'delete-all':deleteEverything();break;default:break}}catch(e){console.error(e);toast('처리하지 못했어요: '+(e.message||'다시 눌러 주세요.'),true)}});
document.addEventListener('click',ev=>{if(ev.target.closest('#materials-details summary'))materialsOpen=!materialsOpen});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='owner-select'){ownerId=t.value;render()}else if(t.id==='gallery-filter'){galleryFilter=t.value;render()}else if(t.id==='bg-select'){mutate(()=>{scene.bgId=t.value});renderStudioCanvas()}else if(t.id==='stage-bg'){stage.bgId=t.value;markStage();repaintStage()}else if(t.id==='motion-select'){const e=stage?.entries.find(q=>q.id===stageSelected);if(e){e.motion=t.value;markStage();drawStage(0)}}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='local-room-input'){t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}if(t.id==='brush-size')brushSize=Number(t.value);if(t.id==='motion-speed'){const e=stage?.entries.find(q=>q.id===stageSelected);if(e){e.speed=Number(t.value);markStage()}}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-online-motion]'))onlineSetMotion(t.dataset.onlineMotion,t.value)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(saveTimer)persistDraft();if(stageTimer)persistStage()}});
window.addEventListener('beforeunload',e=>{if(saveTimer||stageTimer){/* IndexedDB writes are asynchronous. Save debounced edits before navigating away when possible. */if(saveTimer)persistDraft();if(stageTimer)persistStage()}});
async function init(){try{activeRoomCode='';activeDbName=DB_NAME;db=await dbOpen();await reloadData();ownerId='guest';view='room-gate';render()}catch(e){console.error(e);$('app').innerHTML='<div class="shell"><div class="panel stack"><h2>🍂 저장 공간을 열 수 없어요</h2><p>이 브라우저에서 IndexedDB 저장이 차단됐을 수 있어요. 일반 브라우저에서 파일을 다시 열거나 게시 사이트로 접속해 주세요. 저장 없이 활동을 시작하도록 안내하지 않습니다.</p><p class="muted">'+esc(e.message)+'</p></div></div>'}}
init();
})();
</script>
